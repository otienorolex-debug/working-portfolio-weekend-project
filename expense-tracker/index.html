<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track expenses in multiple currencies with live exchange rates.">
    <title>Expense Tracker with Live Currency Conversion</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./src/main.js"></script>
</head>
<body>
    <main class="app">
        <header class="app-header">
            <div>
                <p class="eyebrow">Personal finance</p>
                <h1>Expense Tracker</h1>
                <p class="intro">Record spending in the currency you paid and see it converted to your home currency.</p>
            </div>
            <div class="home-currency-control">
                <label for="home-currency">Home currency</label>
                <select id="home-currency" name="homeCurrency">
                    <option value="USD">USD — US Dollar</option>
                    <option value="EUR">EUR — Euro</option>
                    <option value="GBP">GBP — British Pound</option>
                    <option value="KES">KES — Kenyan Shilling</option>
                </select>
            </div>
        </header>

        <section class="panel" aria-labelledby="add-expense-heading">
            <h2 id="add-expense-heading">Add an expense</h2>
            <form id="expense-form" class="expense-form">
                <div class="form-field">
                    <label for="description">Description</label>
                    <input id="description" name="description" type="text" maxlength="120" placeholder="e.g. Lunch" required>
                </div>
                <div class="form-field">
                    <label for="amount">Amount</label>
                    <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="e.g. 12.50" required>
                </div>
                <div class="form-field">
                    <label for="currency">Paid in</label>
                    <select id="currency" name="currency" required>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="KES">KES</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="food">Food</option>
                        <option value="transportation">Transport</option>
                        <option value="shopping">Shopping</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="utilities">Utilities</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <button type="submit">Add expense</button>
            </form>
        </section>

        <section class="panel" aria-labelledby="expenses-heading">
            <div class="list-heading">
                <div>
                    <h2 id="expenses-heading">Your expenses</h2>
                    <p id="rate-status" class="status" role="status" aria-live="polite">Loading live exchange rates…</p>
                    <button id="retry-rates" class="retry-button" type="button" hidden>Retry rates</button>
                </div>
                <label class="filter-control" for="category-filter">
                    Filter
                    <select id="category-filter" name="categoryFilter">
                        <option value="all">All categories</option>
                        <option value="food">Food</option>
                        <option value="transportation">Transport</option>
                        <option value="shopping">Shopping</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="utilities">Utilities</option>
                        <option value="other">Other</option>
                    </select>
                </label>
            </div>
            <p id="expense-total" class="expense-total" aria-live="polite"></p>
            <p id="expenses-empty-state" class="empty-state">No expenses yet. Add one above to get started.</p>
            <ul id="expense-list" class="expense-list" aria-live="polite" aria-relevant="additions removals"></ul>
        </section>
        <footer>Exchange rates supplied by <a href="https://open.er-api.com/" target="_blank" rel="noreferrer">Open Exchange Rates API</a>.</footer>
    </main>

    <template id="expense-item-template">
        <li class="expense-item">
            <div class="expense-main">
                <h3 data-field="description"></h3>
                <p class="expense-category" data-field="category"></p>
            </div>
            <p class="amounts">
                <span>Paid: <strong data-field="original-amount"></strong></span>
                <span>Converted: <strong data-field="converted-amount"></strong></span>
            </p>
            <button type="button" class="delete-button" data-action="delete">Delete</button>
        </li>
    </template>
</body>
</html>
